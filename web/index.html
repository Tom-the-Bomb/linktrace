<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06080f" />

    <!-- Primary meta -->
    <title>LinkTrace — Distributed site &amp; link auditor</title>
    <meta
      name="description"
      content="Enter a domain. Find broken links, score your on-page SEO, and explore your whole site as an interactive graph."
    />
    <link rel="canonical" href="https://linktrace.tomthebomb.dev/" />

    <!-- Icons (Link2 glyph). SVG for modern browsers, .ico for legacy, PNG for iOS. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LinkTrace" />
    <meta property="og:title" content="LinkTrace — Distributed site &amp; link auditor" />
    <meta
      property="og:description"
      content="Enter a domain. Find broken links, score your on-page SEO, and explore your whole site as an interactive graph."
    />
    <meta property="og:url" content="https://linktrace.tomthebomb.dev/" />
    <meta property="og:image" content="https://linktrace.tomthebomb.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LinkTrace — Healthy links. Higher rankings." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LinkTrace — Distributed site &amp; link auditor" />
    <meta
      name="twitter:description"
      content="Enter a domain. Find broken links, score your on-page SEO, and explore your whole site as an interactive graph."
    />
    <meta name="twitter:image" content="https://linktrace.tomthebomb.dev/og.png" />
  </head>
  <body class="bg-ink-900 font-sans text-paper antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
