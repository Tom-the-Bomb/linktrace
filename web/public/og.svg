<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#06080f" />

  <!-- faint node graph backdrop -->
  <g stroke="#2a3148" stroke-width="2" fill="#2a3148" opacity="0.5">
    <line x1="120" y1="470" x2="260" y2="540" />
    <line x1="260" y1="540" x2="430" y2="500" />
    <line x1="430" y1="500" x2="560" y2="560" />
    <line x1="980" y1="470" x2="1080" y2="540" />
    <circle cx="120" cy="470" r="6" />
    <circle cx="260" cy="540" r="6" />
    <circle cx="430" cy="500" r="6" />
    <circle cx="560" cy="560" r="6" />
    <circle cx="980" cy="470" r="6" />
    <circle cx="1080" cy="540" r="6" />
  </g>

  <!-- brand row: Link2 glyph + wordmark -->
  <g transform="translate(90 129)">
    <rect width="64" height="64" rx="14" fill="#06080f" stroke="#161b2c" stroke-width="2" />
    <g transform="translate(8 8) scale(2)" fill="none" stroke="#f5b042" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 17H7A5 5 0 0 1 7 7h2" />
      <path d="M15 7h2a5 5 0 1 1 0 10h-2" />
