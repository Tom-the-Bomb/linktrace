    </g>
    <text x="84" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#f5efe4">linktrace</text>
  </g>

  <!-- eyebrow -->
  <text x="92" y="273" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" letter-spacing="6" fill="#f5b042">DISTRIBUTED SITE AUDITOR · OPEN SOURCE</text>

  <!-- headline -->
  <text x="88" y="383" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#f5efe4">Healthy links.</text>
  <text x="88" y="483" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#f5b042">Higher rankings.</text>
